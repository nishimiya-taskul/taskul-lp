    <!-- Splash Screen -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .4s ease-out,visibility .4s ease-out">
      <svg width="58" height="58" viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg"
        style="animation:spin 2.8s ease-in-out infinite">
        <rect x="5" y="5" width="48" height="48" rx="5" stroke="#15CF78" stroke-width="10" stroke-linecap="round"
          style="stroke-dasharray:212;animation:drawLoop 2.8s cubic-bezier(.4,0,.2,1) infinite,fillBox 2.8s cubic-bezier(.4,0,.2,1) infinite" />
        <path d="M17 29L25 37L41 21" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
          style="stroke-dasharray:40;stroke-dashoffset:40;animation:checkLoop 2.8s ease-in-out infinite" />
      </svg>
      <style>
        @keyframes drawLoop {
          0% { stroke-dashoffset: 212; opacity: 1; }
          30% { stroke-dashoffset: 0; opacity: 1; }
          55% { stroke-dashoffset: 0; opacity: 1; }
          75% { stroke-dashoffset: -212; opacity: .6; }
          85% { stroke-dashoffset: -212; opacity: 0; }
          100% { stroke-dashoffset: 212; opacity: 0; }
        }
        @keyframes fillBox {
          0%,28% { fill: transparent; }
          38% { fill: #15CF78; }
          55% { fill: #15CF78; }
          70% { fill: transparent; }
          100% { fill: transparent; }
        }
        @keyframes checkLoop {
          0%,28% { stroke-dashoffset: 40; opacity: 1; }
          42% { stroke-dashoffset: 0; opacity: 1; }
          55% { stroke-dashoffset: 0; opacity: 1; }
          68% { stroke-dashoffset: 0; opacity: 0; }
          70% { stroke-dashoffset: 40; opacity: 0; }
          100% { stroke-dashoffset: 40; opacity: 0; }
        }
        @keyframes spin {
          0%,55% { transform: rotate(0deg); }
          80% { transform: rotate(360deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>

    <div id="root"></div>
    <!-- デモ描画完了を親LP(FVのposter)へ通知。#rootマウントだけでは早すぎ(内部スケルトン段階)なので、ダッシュボードのテキストが揃うまで待つ。約12秒で強制送信の保険付き。単独表示(iframe外)では送らない -->
    <script>(function(){if(parent===window)return;var r=document.getElementById('root');function ping(){try{parent.postMessage({type:'taskul-demo-ready'},'*')}catch(e){}}
      function ready(){return r&&(r.innerText||'').replace(/\s/g,'').length>500;}
      var t=0,iv=setInterval(function(){if(ready()||++t>30){clearInterval(iv);setTimeout(ping,250);}},400);})();</script>
